<style>html,body{margin:0}[hidden]{display:none!important}body{font:14px -apple-system,BlinkMacSystemFont,sans-serif}</style>
<style>
.ghsetup{position:fixed;inset:0;z-index:100;background:rgba(20,20,30,.45);display:grid;place-items:center;padding:16px;font-family:system-ui,-apple-system,sans-serif}
.ghbox{background:#fff;color:#1b1420;border-radius:20px;padding:18px;width:min(420px,100%);display:grid;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ghbox b{font-size:18px}.ghbox p{margin:0;font-size:14px;opacity:.85}
.ghbox label{display:grid;gap:4px;font-size:13px;font-weight:600}
.ghbox input{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid #d3e2f4;border-radius:12px}
.ghbtns{display:flex;gap:8px;flex-wrap:wrap}.ghbtns button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 16px;cursor:pointer;background:#EDF4FD}
.ghbtns button:first-child{background:#8a5a36;color:#fff}.ghmsg{min-height:1.2em;color:#b3261e}
</style>
<script>/* Гимназия: автономная версия. Хранение записей в закрытом репозитории GitHub вместо облака claude.ai */
(function(){
  const CFG_KEY='gim-gh-cfg', STORE_KEY='gim-gh-store', LOCALF_KEY='gim-gh-files';
  const cfg=(()=>{try{return JSON.parse(localStorage.getItem(CFG_KEY)||'null')}catch(e){return null}})();
  // личные данные класса (списки, документы) хранятся только в закрытом репозитории
  try{window.__gimPriv=JSON.parse(localStorage.getItem('gim-priv')||'null')}catch(e){window.__gimPriv=null}
  if(cfg&&!window.__gimPriv){fetch('https://api.github.com/repos/'+cfg.repo+'/contents/private.json',{headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github.raw'},cache:'no-store'})
    .then(r=>r.ok?r.text():null).then(t=>{if(t){try{JSON.parse(t);localStorage.setItem('gim-priv',t);location.reload()}catch(e){}}}).catch(()=>{})}
  // store = {docs:{id:obj}, dirty:{id:true}, sha:''}
  let store=(()=>{try{return JSON.parse(localStorage.getItem(STORE_KEY)||'null')}catch(e){return null}})()||{docs:{},dirty:{},sha:''};
  let files=(()=>{try{return JSON.parse(localStorage.getItem(LOCALF_KEY)||'{}')}catch(e){return {}}})();
  const saveStore=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(store))}catch(e){}};
  const saveFiles=()=>{try{localStorage.setItem(LOCALF_KEY,JSON.stringify(files))}catch(e){}};
  const listeners=[]; let lastErr=null;
  const b64e=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r)};
  const b64d=s=>{const bin=atob(s.replace(/\n/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)};
  const api=(path,opt={})=>fetch('https://api.github.com/repos/'+cfg.repo+'/contents/'+path,{...opt,headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})},cache:'no-store'});
  const ts=v=>+(v&&v.updated)||0;
  function merge(remote){const out={...remote};for(const id in store.docs){if(store.dirty[id]){const l=store.docs[id],r=remote[id];out[id]=(!r||ts(l)>=ts(r))?l:r}}return out}
  async function pull(){if(!cfg)return;try{const r=await api('data.json');
      if(r.status===404){store.sha='';emit();return}
      if(!r.ok)throw new Error('pull '+r.status);
      const j=await r.json();const remote=JSON.parse(b64d(j.content||'')||'{}').docs||{};
      store.sha=j.sha;store.docs=merge(remote);saveStore();lastErr=null;emit()}
    catch(e){lastErr=e;emit(true)}}
  let pushing=null,pushTimer=null;
  function schedulePush(){clearTimeout(pushTimer);pushTimer=setTimeout(push,1500)}
  async function push(){if(!cfg)return;if(pushing)return pushing;if(!Object.keys(store.dirty).length)return;
    pushing=(async()=>{for(let attempt=0;attempt<4;attempt++){
        try{const sent=Object.keys(store.dirty);const body={message:'Гимназия: записи '+new Date().toISOString().slice(0,16),content:b64e(JSON.stringify({docs:store.docs,updated:Date.now()})),...(store.sha?{sha:store.sha}:{})};
          const r=await api('data.json',{method:'PUT',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
          if(r.status===409||r.status===422){await pull();continue}
          if(!r.ok)throw new Error('push '+r.status);
          const j=await r.json();store.sha=j.content&&j.content.sha||store.sha;sent.forEach(id=>delete store.dirty[id]);saveStore();lastErr=null;return true}
        catch(e){lastErr=e;throw e}}
      throw new Error('conflict')})().finally(()=>{pushing=null;if(Object.keys(store.dirty).length&&!lastErr)schedulePush()});
    return pushing}
  function snapshot(){const docs=Object.keys(store.docs).map(id=>({id,data:()=>JSON.parse(JSON.stringify(store.docs[id]))}));
    Object.keys(files).forEach(id=>docs.push({id,data:()=>files[id]}));return {docs,metadata:{fromCache:false,hasPendingWrites:false}}}
  function emit(isErr){listeners.forEach(([cb,eb])=>{try{if(isErr&&eb&&!Object.keys(store.docs).length)eb(lastErr);else cb(snapshot())}catch(e){}})}
  const userCol={
    onSnapshot(cb,eb){listeners.push([cb,eb]);setTimeout(()=>cb(snapshot()),0);pull();return ()=>{}},
    doc(id){return {
      async set(body){if(id.startsWith('file_')){files[id]=body;saveFiles();return}
        if(id==='ui_state'){try{localStorage.setItem('gim-ui-cloud',JSON.stringify(body))}catch(e){}return}
        store.docs[id]=JSON.parse(JSON.stringify(body));store.dirty[id]=true;saveStore();
        if(!cfg)throw new Error('offline');await new Promise(r=>{clearTimeout(pushTimer);pushTimer=setTimeout(r,1200)});await push()},
      async get(){const v=id.startsWith('file_')?files[id]:store.docs[id];return {id,exists:!!v,data:()=>v?JSON.parse(JSON.stringify(v)):undefined}},
      async delete(){if(id.startsWith('file_')){delete files[id];saveFiles();return}delete store.docs[id];store.dirty[id]=true;saveStore();schedulePush()}}}};
  let digestTimer=null;
  const dataCol={doc(id){return {async set(body){if(!cfg||id!=='digest')return;clearTimeout(digestTimer);digestTimer=setTimeout(async()=>{
      try{const r0=await api('digest.json');const sha=r0.ok?(await r0.json()).sha:undefined;
        await api('digest.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Гимназия: сводка',content:b64e(JSON.stringify(body,null,1)),...(sha?{sha}:{})})})}catch(e){}},5000)}}}};
  const db={collection(p){return p==='data'?dataCol:userCol}};
  const downloads={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return 'saved'}};
  window.claude={use:async k=>k==='db'?(cfg?db:null):k==='user'?{id:async()=>'me'}:k==='downloads'?downloads:null};
  setInterval(()=>{if(cfg&&!document.hidden)pull().then(()=>{if(Object.keys(store.dirty).length)push().catch(()=>{})})},60000);
  addEventListener('online',()=>{if(cfg){push().catch(()=>{});pull()}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfg){pull();if(Object.keys(store.dirty).length)push().catch(()=>{})}});
  // окно настройки синхронизации
  window.gimSetup=function(){const cur=cfg||{repo:'Ifuchik/gimnazia-data',token:''};
    const w=document.createElement('div');w.className='ghsetup';w.innerHTML=`<div class="ghbox"><b>Синхронизация с GitHub</b>
      <p>Записи хранятся в вашем закрытом репозитории и одинаково видны на телефоне и компьютере.</p>
      <label>Репозиторий<input id="gh-repo" value="${cur.repo}" autocomplete="off"></label>
      <label>Ключ доступа<input id="gh-token" type="password" placeholder="github_pat_…" value="${cur.token}" autocomplete="off"></label>
      <p class="ghmsg" id="gh-msg"></p>
      <div class="ghbtns"><button id="gh-ok">Подключить</button><button id="gh-skip">Без синхронизации</button></div></div>`;
    document.body.appendChild(w);
    w.querySelector('#gh-skip').onclick=()=>w.remove();
    w.querySelector('#gh-ok').onclick=async()=>{const repo=w.querySelector('#gh-repo').value.trim(),token=w.querySelector('#gh-token').value.trim();const msg=w.querySelector('#gh-msg');
      if(!repo||!token){msg.textContent='Заполните оба поля';return}msg.textContent='Проверяю…';
      try{const r=await fetch('https://api.github.com/repos/'+repo,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});
        if(r.status===401){msg.textContent='Ключ не подошёл. Проверьте, что скопировали его целиком.';return}
        if(r.status===404){msg.textContent='Репозиторий не найден или у ключа нет к нему доступа.';return}
        if(!r.ok){msg.textContent='GitHub ответил ошибкой '+r.status;return}
        localStorage.setItem(CFG_KEY,JSON.stringify({repo,token}));msg.textContent='Готово, перезагружаю…';setTimeout(()=>location.reload(),600)}
      catch(e){msg.textContent='Нет связи с GitHub. Попробуйте позже.'}}};
  if(!cfg)addEventListener('DOMContentLoaded',()=>setTimeout(window.gimSetup,400));
  addEventListener('DOMContentLoaded',()=>{const s=document.getElementById('save');if(s){s.style.cursor='pointer';s.title='Синхронизация';s.addEventListener('click',()=>window.gimSetup())}});
  if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>

<title>Гимназия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width app column, rounded cards, bottom tab bar; wider screens keep the column centred */
:root{
  --hw:#FFF0D2; --hw-ink:#7A4300; --pr:#DCEEFF; --pr-ink:#0B4C8C;
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#1B2333; --muted:#1B2333; --line:#DDE2EA;
  --accent:#2E4057; --accent-soft:#E2E7EF; --ring:#E3262D; --ok:#2F8F5B; --chip:#F5F7FA;
  --display:"PT Serif", Georgia, "Times New Roman", serif;
  --ui:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(40,25,50,.06),0 6px 18px rgba(40,25,50,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141B; --card:#1A202B; --ink:#EEF1F6; --muted:#98A1B3; --line:#2B3342;
  --accent:#A9BEDC; --accent-soft:#25304180; --ring:#FF5A5F; --ok:#5CC48A; --chip:#222A37; --hw:#3B2F14; --hw-ink:#F5C877; --pr:#132B45; --pr-ink:#9ECDFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --hw:#3B2F14; --hw-ink:#F5C877; --pr:#132B45; --pr-ink:#9ECDFF;
  --bg:#10141B; --card:#1A202B; --ink:#EEF1F6; --muted:#98A1B3; --line:#2B3342;
  --accent:#A9BEDC; --accent-soft:#25304180; --ring:#FF5A5F; --ok:#5CC48A; --chip:#222A37;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(24px,7vw,30px);line-height:1.1;margin:2px 0 0;text-wrap:balance}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;background:var(--card);border-radius:999px;padding:5px 10px;box-shadow:var(--shadow);margin-bottom:4px}
.save.warn i{background:var(--ring)}
.save i{flex:0 0 8px}
header.top>div:first-child{min-width:0}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.save.busy i{background:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:1 0 60px;border:0;background:var(--card);color:var(--ink);border-radius:var(--r-md);padding:8px 6px;font:inherit;cursor:pointer;box-shadow:var(--shadow);display:grid;gap:2px;justify-items:center}
.day b{font-size:15px}.day small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--accent);color:var(--card)}
.day[aria-pressed="true"] small{color:inherit;opacity:.8}
.list{display:grid;gap:10px}
.lesson{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow);border:0;text-align:left;font:inherit;color:inherit;width:100%;cursor:pointer;position:relative}
.lesson.r302{box-shadow:inset 0 0 0 3px var(--ring),var(--shadow)}
.lesson.muted{cursor:default;opacity:.65}
.lesson:focus-visible,.day:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{display:grid;justify-items:center;gap:1px;padding:8px 0;border-radius:var(--r-sm);background:var(--chip)}
.num b{font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.num span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.what{min-width:0}
.what .cls{font-family:var(--display);font-size:24px;line-height:1.05}
.what .sub{font-size:14px;color:var(--muted)}
.what .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.pill.room302{background:var(--ring);color:#fff}
.dots{display:grid;gap:5px;justify-items:end}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.hint{font-size:13px;color:var(--muted);margin:2px 4px 12px}
.section-title{font-family:var(--display);font-size:20px;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.section-title small{font-family:var(--ui);font-size:13px;color:var(--muted);font-weight:400}
.prep{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.prep-row{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit;width:100%;cursor:pointer}
.prep-row:first-child{border-top:0}
.prep-row.r302 .num{box-shadow:inset 0 0 0 3px var(--ring)}
.prep-row .t{min-width:0}
.prep-row .head{font-weight:600}.prep-row .head em{font-style:normal;color:var(--muted);font-weight:400}
.prep-row .body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px}
.prep-row .empty{color:var(--muted);font-size:14px;margin-top:3px}
.prep-row .from{font-size:12px;color:var(--muted);margin-top:4px}
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ccard{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;display:grid;gap:6px}
.ccard .cls{font-family:var(--display);font-size:30px;line-height:1}
.ccard .sub{font-size:13px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:transparent;pointer-events:none}
.tabs nav{max-width:520px;margin:0 auto;display:flex;gap:4px;background:var(--card);border-radius:24px;padding:6px;box-shadow:0 8px 30px rgba(40,25,50,.18);pointer-events:auto}
.tab{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;padding:7px 4px 6px;border-radius:18px;cursor:pointer;display:grid;justify-items:center;gap:2px;transition:background .2s,color .2s}
.tab .ti{transition:transform .2s}.tab[aria-selected="true"] .ti{transform:translateY(-1px) scale(1.06)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--card)}
.sheet-wrap{position:fixed;inset:0;z-index:30;background:rgba(10,15,25,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:26px;max-height:88%}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px;box-shadow:0 0 0 12px transparent;touch-action:none}
.sheet{overscroll-behavior:contain}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sheet-head .cls{font-family:var(--display);font-size:30px;line-height:1}
.sheet-head .sub{color:var(--muted);font-size:14px;margin-top:4px}
.btn{border:0;font:inherit;font-weight:600;border-radius:999px;padding:9px 14px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:var(--card)}
.field{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:8px}
.field label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:2px}
.field textarea{width:100%;box-sizing:border-box;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;line-height:1.35;resize:none;min-height:30px;outline:none;padding:2px 0;overflow:hidden;display:block}
.from-prev{background:var(--accent-soft);border-radius:var(--r-md);padding:10px 14px;margin-bottom:10px;font-size:14px}
.from-prev b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:14px 4px 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend .sw{width:14px;height:14px;border-radius:5px;box-shadow:inset 0 0 0 3px var(--ring)}
.legend .dt{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.weeks{display:flex;gap:6px;background:var(--card);border-radius:999px;padding:5px;box-shadow:var(--shadow);margin-bottom:10px}
.wk{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:8px 4px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums}
.wk[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.wk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.day.off{opacity:.55}.day.off small{text-decoration:line-through}
.offbox{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;text-align:center;display:grid;gap:10px;justify-items:center}
.offbox b{font-family:var(--display);font-size:20px}
.dayfoot{display:flex;justify-content:flex-end;margin-top:14px}
.linkbtn{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}

  const tf=e.target.closest('[data-tfilter]'); if(tf){taskFilter=tf.dataset.tfilter;try{localStorage.setItem(LS+'-tf',JSON.stringify({f:taskFilter,c:newCat}))}catch(_){}render();return}
  const jp=e.target.closest('[data-jump]'); if(jp){taskFilter='all';render();const el=document.getElementById('sec-'+jp.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  const ted=e.target.closest('[data-tedit]'); if(ted){editId=ted.dataset.tedit;movingId=null;render();requestAnimationFrame(()=>{const a=document.getElementById('te-t');if(a){a.focus();a.setSelectionRange(a.value.length,a.value.length)}});return}
  if(e.target.closest('[data-tecancel]')){editId=null;render();return}
  const tca=e.target.closest('[data-tecat]'); if(tca){tca.closest('.catpick').querySelectorAll('[data-tecat]').forEach(b=>b.setAttribute('aria-pressed',b===tca));return}
  const tim=e.target.closest('[data-teimp]'); if(tim){const on=tim.getAttribute('aria-pressed')!=='true';tim.setAttribute('aria-pressed',on);tim.classList.toggle('impon',on);return}
  const mv=e.target.closest('[data-tmove]'); if(mv){movingId=movingId===mv.dataset.tmove?null:mv.dataset.tmove;render();return}
  const tt=e.target.closest('[data-tto]'); if(tt){const [id,d]=tt.dataset.tto.split('|');moveTask(id,d);return}
  const td=e.target.closest('[data-tdel]'); if(td){const idx=kr.tasks.findIndex(t=>t.id===td.dataset.tdel);if(idx<0)return;const [t]=kr.tasks.splice(idx,1);saveKr(true);render();toast('Дело удалено',()=>{kr.tasks.splice(idx,0,t);saveKr(true);render()});return}
  if(e.target.closest('#toastUndo')){const f=undoFn;undoFn=null;document.getElementById('toast').hidden=true;if(f)f();return}
  if(e.target.closest('[data-formclose]')){formOpen=false;const f=document.querySelector('.addtask');if(f)f.classList.remove('open');return}
  });
function moveTask(id,d){const t=kr.tasks.find(t=>t.id===id);if(!t||!d)return;if(d!==t.date){t.date=d;t.moved=(t.moved||0)+1;if(t.status==='done')setStatus(t,'new')}movingId=null;saveKr(true);render()}
document.addEventListener('change',e=>{
  const dd=e.target.closest('[data-tdate]');if(dd&&dd.value)moveTask(dd.dataset.tdate,dd.value)});
document.addEventListener('input',e=>{const f=e.target.closest('.kr-f');if(!f)return;const [a,b]=f.dataset.kr.split('.');if(b){kr[a][b]=f.value}else kr[a]=f.value;grow(f);saveKr()});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.form==='tedit'){const t=kr.tasks.find(x=>x.id===f.dataset.id);if(!t)return;const v=f.querySelector('#te-t').value.trim();if(!v){f.querySelector('#te-t').focus();return}
    t.t=v;const c=f.querySelector('[data-tecat][aria-pressed="true"]');if(c)t.cat=c.dataset.tecat;const d=f.querySelector('#te-d').value;if(d)t.date=d;t.imp=f.querySelector('[data-teimp]').getAttribute('aria-pressed')==='true';
    editId=null;saveKr(true);render();toast('Дело изменено');return}
  if(f.dataset.form==='extra'&&f.dataset.xid){const e=kr.extras.find(z=>z.id===f.dataset.xid);if(!e)return;const cls=f.querySelector('#x-cls').value.trim().toUpperCase();if(!cls){f.querySelector('#x-cls').focus();return}
    const nd=f.querySelector('#x-d').value;if(nd&&byIso[nd])e.iso=nd;e.l=+f.querySelector('#x-l').value;e.cls=cls;e.sub=f.querySelector('#x-sub').value.trim();e.r=f.querySelector('#x-r').value.trim();e.note=f.querySelector('#x-note').value.trim();
    xEditId=null;if(e.iso!==day){day=e.iso}saveKr(true);if(!sheet.hidden)closeSheet();else render();toast(isOff(e.iso)?'Сохранено, но этот день отмечен выходным':'Замена изменена');return}
  if(f.dataset.form==='extra'){const cls=f.querySelector('#x-cls').value.trim().toUpperCase();if(!cls){f.querySelector('#x-cls').focus();return}if(kr.extras.some(x=>x.iso===day&&+x.l===+f.querySelector('#x-l').value&&String(x.cls).toUpperCase()===cls)){xForm=false;render();toast('Этот урок уже добавлен');return}kr.extras.push({id:'p_x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),iso:day,l:+f.querySelector('#x-l').value,cls,sub:f.querySelector('#x-sub').value.trim(),r:f.querySelector('#x-r').value.trim(),note:f.querySelector('#x-note').value.trim()});xForm=false;saveKr(true);render();toast('Урок добавлен');return}
  if(f.dataset.form==='event'){const t=f.querySelector('#ev-t').value.trim(),d=f.querySelector('#ev-d').value;if(t&&d){kr.events.push({id:'e'+(tid++),t,date:d,time:f.querySelector('#ev-time').value,place:f.querySelector('#ev-p').value.trim(),note:f.querySelector('#ev-n').value.trim()});saveKr(true);render()}return}
  if(f.dataset.form==='task'){const v=f.querySelector('#task-new').value.trim(),d=f.querySelector('#task-date').value||todayIso;if(v||pendingFiles.length){kr.tasks.push({id:'t'+(tid++),t:v||pendingFiles.map(f=>f.name).join(', '),date:d,cat:newCat,imp:newImp,status:'new',done:false,created:todayIso,files:pendingFiles});pendingFiles=[];newTaskText='';newImp=false;saveKr(true);render()}}
  else{const who=f.querySelector('#c-who').value.trim(),date=f.querySelector('#c-date').value,text=f.querySelector('#c-text').value.trim();
    if(who||text){kr.contacts.push({who,date:date?date.split('-').reverse().join('.'):'',text});saveKr(true);render()}}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const v=document.getElementById('viewer');if(!v.hidden){v.hidden=true;v.innerHTML='';return}if(!sheet.hidden)closeSheet()});
// ---------- память интерфейса: вкладка, день, раскрытые списки, прокрутка, открытый урок ----------
let firstCloud=false, uiCloudSeen=false, uiLocalHad=false, uiRestorePending=false, uiTimer=null;
const ui={scroll:{},sheet:null};
function snapUI(){return {exp:expId,tab,day,lm:lessonsMode,jc:jClass,ks:krSec,tf:taskFilter,dd:ddOpen,mg:myGridOpen,scroll:ui.scroll,sheet:ui.sheet,at:Date.now()}}
function applyUI(u){if(!u)return;
  if(u.tab&&['tasks','week','kr','ktp'].includes(u.tab))tab=u.tab;
  if(u.day&&byIso[u.day])day=u.day;
  if(u.lm)lessonsMode=u.lm; if(typeof u.jc==='number')jClass=u.jc; if(u.ks)krSec=u.ks; if(u.tf)taskFilter=u.tf;
  if(u.dd&&typeof u.dd==='object')Object.assign(ddOpen,u.dd); if(typeof u.mg==='boolean')myGridOpen=u.mg;
  if(u.scroll&&typeof u.scroll==='object')ui.scroll=u.scroll; ui.sheet=u.sheet||null; if(u.exp&&byId[u.exp])expId=u.exp;}
function saveUI(){const u=snapUI();try{localStorage.setItem(LS+'-uistate',JSON.stringify(u))}catch(e){}
  clearTimeout(uiTimer);uiTimer=setTimeout(()=>{if(col)col.doc('ui_state').set(snapUI()).catch(()=>{})},1500)}
function restoreScroll(){const y=ui.scroll[tab]||0;requestAnimationFrame(()=>{scrollTo(0,y);setTimeout(()=>scrollTo(0,y),120)})}
try{const u=JSON.parse(localStorage.getItem(LS+'-uistate')||'null');if(u){uiLocalHad=true;applyUI(u)}}catch(e){}
let scrollT=null;
addEventListener('scroll',()=>{if(!sheet.hidden)return;clearTimeout(scrollT);scrollT=setTimeout(()=>{ui.scroll[tab]=Math.round(window.scrollY);saveUI()},250)},{passive:true});
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){requestAnimationFrame(()=>{const y=ui.scroll[tab]||0;scrollTo(0,y)})}},true);
document.addEventListener('toggle',()=>saveUI(),true);

render();
restoreScroll();
if(ui.sheet&&byId[ui.sheet])openSheet(ui.sheet);

// кнопка быстрой прокрутки: вниз, а у самого низа наверх
(function(){const b=document.getElementById('scrollfab');let up=false,raf=0;
  function upd(){raf=0;const doc=document.documentElement,max=doc.scrollHeight-innerHeight;
    if(max<300){b.hidden=true;return}b.hidden=false;const nu=scrollY>max-200;if(nu!==up){up=nu;b.classList.toggle('up',up);b.setAttribute('aria-label',up?'Наверх':'Прокрутить вниз')}}
  const q=()=>{if(!raf)raf=requestAnimationFrame(upd)};
  addEventListener('scroll',q,{passive:true});addEventListener('resize',q);new MutationObserver(q).observe(document.getElementById('view'),{childList:true,subtree:true});
  b.addEventListener('click',()=>{const max=document.documentElement.scrollHeight-innerHeight;scrollTo({top:up?0:max,behavior:'smooth'})});q()})();


function fitGrid(){const g=document.querySelector('#view .lgrid');if(!g)return;g.style.gridAutoRows='';
  const nav=document.querySelector('.tabs nav');const navTop=nav?nav.getBoundingClientRect().top:innerHeight;
  const top=g.getBoundingClientRect().top+scrollY-scrollY;const gap=parseFloat(getComputedStyle(g).rowGap)||8;
  const gr=g.getBoundingClientRect();let lim=navTop;['#fab','.scrollfab'].forEach(q=>{const f=document.querySelector(q);if(!f||f.hidden||getComputedStyle(f).display==='none')return;const r=f.getBoundingClientRect();if(r.width&&r.left<gr.right&&r.top<lim)lim=r.top});
  const avail=lim-gr.top-10;
  if(scrollY>40)return;
  let h=Math.floor((avail-2*gap)/3);h=Math.max(96,h);g.style.gridAutoRows=h+'px'}
{let raf2=0;const run=()=>{cancelAnimationFrame(raf2);raf2=requestAnimationFrame(fitGrid)};new MutationObserver(run).observe(document.getElementById('view'),{childList:true});addEventListener('resize',run);setTimeout(run,300)}

// iOS Safari: окно урока поднимается над клавиатурой
(function(){const vv=window.visualViewport;if(!vv)return;
  function fit(){const w=document.querySelector('#sheet .sheet-wrap');if(!w)return;const sh=w.querySelector('.sheet');const kb=window.innerHeight-vv.height>120;
    if(kb){w.style.top=vv.offsetTop+'px';w.style.height=vv.height+'px';w.style.bottom='auto';w.style.alignItems='flex-end';if(sh)sh.style.maxHeight=(vv.height-6)+'px';
      const a=document.activeElement;if(a&&sh&&sh.contains(a)&&a.matches('textarea,input')){const r=a.getBoundingClientRect(),sr=sh.getBoundingClientRect();if(r.bottom>sr.bottom-8||r.top<sr.top)sh.scrollTop+=r.top-sr.top-60}}
    else{w.style.top='';w.style.height='';w.style.bottom='';w.style.alignItems='';if(sh)sh.style.maxHeight=''}}
  vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);document.addEventListener('focusin',()=>setTimeout(fit,60));document.addEventListener('focusout',()=>setTimeout(fit,120))})();

// КТП: автоматически открывается класс и предмет текущего или следующего урока
let ktpAutoId=null;
function ktpTarget(){const n=new Date(),iso=`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`,m=n.getHours()*60+n.getMinutes();
  const mm=s=>{const[h,mi]=s.trim().split(':');return +h*60+ +mi};
  return ALL.filter(x=>!x.extra&&ktpKey(x.cls,x.sub)&&!isCancel(x)&&(x.iso>iso||(x.iso===iso&&TIMES[x.l]&&mm(TIMES[x.l].split('–')[1])>m)))
    .sort((a,b)=>a.iso<b.iso?-1:a.iso>b.iso?1:a.l-b.l)[0]||null}
function ktpAuto(){const t=ktpTarget();ktpAutoId=t?t.id:'';if(!t)return;ktpPlan=ktpKey(t.cls,t.sub);ktpCls[ktpPlan]=t.cls;
  setTimeout(()=>{const c=document.getElementById('ktp-cur');if(c&&tab==='ktp')c.scrollIntoView({block:'center'})},80)}
setInterval(()=>{if(tab!=='ktp'||!sheet.hidden)return;const a=document.activeElement;if(a&&a.matches&&a.matches('textarea,input'))return;const t=ktpTarget();if((t?t.id:'')!==ktpAutoId){ktpAuto();render()}},20000);
// подсветка урока, который идёт прямо сейчас
function markNow(){const n=new Date(),iso=`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`,m=n.getHours()*60+n.getMinutes();
  const mm=s=>{const[h,mi]=s.trim().split(':');return +h*60+ +mi};
  document.querySelectorAll('[data-accid],.lesson[data-open]').forEach(el=>{const x=byId[el.dataset.accid||el.dataset.open];let on=false;
    try{if(x&&x.iso===iso&&TIMES[x.l]&&!isCancel(x)){const[a,b]=TIMES[x.l].split('–');on=m>=mm(a)&&m<mm(b)}}catch(e){}
    el.classList.toggle('is-now',on)})}
setInterval(markNow,20000);
{let raf=0;new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(markNow)}).observe(document.body,{childList:true,subtree:true})}
markNow();

document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-ins]'))e.preventDefault()});
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-ins]'))e.preventDefault()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-ins]');if(!b)return;e.preventDefault();e.stopPropagation();
  const t=b.closest('.field')&&b.closest('.field').querySelector('textarea');if(!t)return;
  const focused=document.activeElement===t;const st=focused?t.selectionStart:t.value.length,en=focused?t.selectionEnd:t.value.length;
  t.setRangeText(b.dataset.ins,st,en,'end');if(!focused)t.focus({preventScroll:true});
  t.dispatchEvent(new Event('input',{bubbles:true}))},true);

document.addEventListener('click',e=>{const j=e.target.closest('[data-jurl]');if(!j)return;e.preventDefault();e.stopPropagation();
  const a=document.createElement('a');a.href=j.dataset.jurl;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()},true);

// карточки появляются по мере прокрутки
(function(){const seen=new Set();const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce||!('IntersectionObserver' in window))return;
  const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){const el=en.target;el.classList.add('rv-in');seen.add(el.dataset.rvk);io.unobserve(el)}})},{rootMargin:'0px 0px -40px 0px',threshold:.05});
  function scan(){document.querySelectorAll('#view .acc, #view .task, #view .prepacc, #view details.dd, #view .kr-card, #view .jrow, #view .gcard, #view .st2').forEach((el,i)=>{
    if(el.dataset.rvk)return;const k=(el.dataset.accid||el.id||'')+'|'+(el.textContent||'').slice(0,40);el.dataset.rvk=k;
    if(seen.has(k))return;const r=el.getBoundingClientRect();if(r.top<innerHeight-40){seen.add(k);return}
    el.classList.add('rv');io.observe(el)})}
  new MutationObserver(()=>requestAnimationFrame(scan)).observe(document.getElementById('view'),{childList:true,subtree:true});scan()})();
